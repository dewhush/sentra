[workspace]
resolver = "3"
members = [
    "crates/sentra-daemon",
    "crates/sentra-cli",
    "crates/sentra-ui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"

[profile.release]
strip = true
lto = true
