<!doctype html><meta charset="utf-8"><style>
*{margin:0;padding:0}
body{width:512px;height:512px;background:#0f1115;display:grid;place-items:center}
.sq{width:340px;height:340px;border-radius:76px;background:#161a22;display:grid;
  grid-template:1fr 1fr / 1fr 1fr;gap:18px;padding:34px}
.q{border-radius:22px;background:var(--c)}
.q:nth-child(1){--c:#3ddc97}
.q:nth-child(2){--c:#4cc2ff}
.q:nth-child(3){--c:#ffbd2e}
.q:nth-child(4){--c:#f778ba}
</style><div class="sq"><div class="q"></div><div class="q"></div><div class="q"></div><div class="q"></div></div>
