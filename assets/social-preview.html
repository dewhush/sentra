* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1280px; height:640px; overflow:hidden; }
body {

}
.card { position:relative; width:1280px; height:640px; overflow:hidden; }

/* faint blueprint grid + electric sweeps (banner.html language) */
.grid-bg {
  position:absolute; inset:0;
  background-image:
    linear-gradient(#ffffff0a 1px, transparent 1px),
    linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
  background-size:32px 32px;
}
.sweep { position:absolute; right:-160px; top:-220px; width:760px; height:760px;
  background:radial-gradient(circle at center, #2d81ff30 0%, transparent 62%); }
.sweep.bl { right:auto; left:-240px; top:auto; bottom:-300px;
  background:radial-gradient(circle at center, #2d81ff1a 0%, transparent 64%); }

/* top strip */
.strip { position:absolute; top:44px; left:76px; right:76px;
  display:flex; align-items:center; gap:12px;
  font-family:'Geist Mono',ui-monospace,monospace;
  font-size:13px; letter-spacing:0.22em; color:#73737c; }
.strip .logo { width:26px; height:26px; }
.strip .word { color:#f2f1ee; font-weight:700; }
.strip .sp { flex:1; }
.strip .tag { font-size:11px; letter-spacing:0.14em; color:#2d81ff;
  border:1px solid #2d81ff55; border-radius:999px; padding:5px 14px; }

/* headline block */
.inner { position:absolute; left:76px; right:76px; top:150px; }
h1 { font-family:'Archivo',system-ui,sans-serif; font-size:104px; font-weight:800;
  line-height:0.98; letter-spacing:-3.4px; }
h1 em { font-family:'Instrument Serif',Georgia,serif; font-style:italic;
  font-weight:400; letter-spacing:0; color:#2d81ff; }
p.tagline { margin-top:22px; font-size:30px; line-height:1.35; color:#f2f1ee;
  font-weight:500; letter-spacing:-0.4px; }
p.tagline em { font-family:'Instrument Serif',Georgia,serif; font-style:italic;
  font-weight:400; color:#2d81ff; letter-spacing:0; }
p.detail { margin-top:14px; font-size:18.5px; line-height:1.55; color:#8b8b94; max-width:62ch; }
p.detail b { color:#c9c9d1; font-weight:600; }

/* feature strip */
.feat { margin-top:38px; display:flex; align-items:center; gap:14px;
  font-family:'Geist Mono',ui-monospace,monospace;
  font-size:14px; letter-spacing:0.06em; color:#a3a3ab; }
.feat .chip { border:1px solid #ffffff1f; border-radius:999px; padding:10px 18px;
  background:#ffffff08; color:#e7e7ea; }
.feat .sep { color:#2d81ff; }

/* footer */
.foot { position:absolute; left:76px; right:76px; bottom:38px;
  display:flex; align-items:center; gap:12px;

.foot .sp { flex:1; }
.foot .url { color:#2d81ff; }
